# LOCAL PROPOSAL ONLY: producer SHA bound; consumer transfer and hosted run require founder approval.
name: PatchWRK separate consumer qualification
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: patchwrk-0-1-1-separate-consumer
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'patchwrk-dev/patchwrk-scanner-action-consumer-test' && github.ref == 'refs/heads/main' && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: target
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - id: producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: patchwrk-dev/patchwrk-action
          ref: 9bc7c1dd79eccf8ab55abbe09fb5f70de1f53e7a
          path: producer
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - id: runtime
        uses: ./target/.github/actions/node24-probe
      - name: Verify identities and snapshot checkout
        env:
          QUALIFICATION_NODE: ${{ steps.runtime.outputs.node }}
          CONSUMER_COMMIT: ${{ steps.target.outputs.commit }}
          PRODUCER_COMMIT: 9bc7c1dd79eccf8ab55abbe09fb5f70de1f53e7a
        run: '"$QUALIFICATION_NODE" target/harness/check.mjs before'
      - id: scan
        uses: patchwrk-dev/patchwrk-action@9bc7c1dd79eccf8ab55abbe09fb5f70de1f53e7a
        with:
          path: target/fixtures/project
      - name: Verify exact findings and unchanged checkout
        env:
          QUALIFICATION_NODE: ${{ steps.runtime.outputs.node }}
          CONSUMER_COMMIT: ${{ steps.target.outputs.commit }}
          PRODUCER_COMMIT: 9bc7c1dd79eccf8ab55abbe09fb5f70de1f53e7a
          QUALIFICATION_RESULT: ${{ steps.scan.outputs.result }}
          QUALIFICATION_STATUS: ${{ steps.scan.outputs.status }}
        run: '"$QUALIFICATION_NODE" target/harness/check.mjs after'
